<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Matisse Dancers</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        background: #1a5276;
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
        overflow: hidden;
      }
      canvas {
        display: block;
      }
    </style>
  </head>
  <body>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.0/p5.min.js"></script>
    <script>
      const BLUE = [28, 83, 142];
      const GREEN = [26, 111, 80];
      const SALMON = [240, 158, 130];
      const DARK = [30, 20, 18];

      let dancers = [];
      let t = 0;

      function setup() {
        createCanvas(windowWidth, windowHeight);
        colorMode(RGB);
        noFill();
        initDancers();
      }

      function initDancers() {
        dancers = [];
        let count = 5;
        for (let i = 0; i < count; i++) {
          let angle = (TWO_PI / count) * i - HALF_PI;
          dancers.push({
            baseAngle: angle,
            phase: random(TWO_PI),
            speed: random(0.003, 0.007),
            scale: random(0.85, 1.15),
          });
        }
      }

      function draw() {
        t += 0.008;
        background(...BLUE);
        let cx = width / 2;
        let cy = height / 2;
        let radius = min(width, height) * 0.36;
        drawHill();
        for (let i = 0; i < dancers.length; i++) {
          let d = dancers[i];
          let a = d.baseAngle + sin(t * 0.35 + d.phase) * 0.22;
          let x = cx + cos(a) * radius;
          let y = cy + sin(a) * radius * 0.52 + height * 0.06;
          let sway = sin(t * 0.9 + d.phase) * 0.18;
          drawFigure(x, y, d.scale, sway);
        }
        drawHandLinks(cx, cy, radius);
      }

      function drawHill() {
        fill(...GREEN);
        noStroke();
        beginShape();
        vertex(0, height);
        for (let x = 0; x <= width; x += 20) {
          let n = noise(x * 0.003, t * 0.2);
          let y = height * 0.68 + n * height * 0.08;
          vertex(x, y);
        }
        vertex(width, height);
        endShape(CLOSE);
      }

      function drawBlob(x, y, w, h, angle) {
        push();
        translate(x, y);
        rotate(angle);
        ellipse(0, 0, w, h);
        pop();
      }

      function drawFigure(cx, cy, sc, sway) {
        push();
        translate(cx, cy);
        rotate(sway);
        scale(sc * min(width, height) * 0.0024);

        noStroke();
        fill(...SALMON);

        let legL = sin(sway * 3.5) * 0.12;
        let legR = sin(sway * 2.8 + 1.2) * 0.14;
        let armL = sin(sway * 2.2) * 0.18;
        let armR = sin(sway * 2.2 + 0.6) * 0.2;

        // Overlapping soft blobs — Matisse cut-out style
        drawBlob(-16, 128, 44, 148, legL);
        drawBlob(16, 128, 44, 148, legR);
        drawBlob(0, -18, 78, 118, 0);
        drawBlob(0, -96, 54, 58, 0);
        drawBlob(-52, -42, 88, 34, -0.75 + armL);
        drawBlob(58, -52, 96, 36, 0.65 + armR);

        // Hair cap
        fill(...DARK);
        drawBlob(0, -118, 48, 36, 0);

        pop();
      }

      function drawSolidRibbon(x1, y1, x2, y2, arch, thickness) {
        let mx = (x1 + x2) / 2;
        let my = (y1 + y2) / 2 + arch;
        let steps = 14;
        let top = [];
        let bot = [];
        for (let i = 0; i <= steps; i++) {
          let u = i / steps;
          let omu = 1 - u;
          let px = omu * omu * x1 + 2 * omu * u * mx + u * u * x2;
          let py = omu * omu * y1 + 2 * omu * u * my + u * u * y2;
          let tx = 2 * omu * (mx - x1) + 2 * u * (x2 - mx);
          let ty = 2 * omu * (my - y1) + 2 * u * (y2 - my);
          let len = sqrt(tx * tx + ty * ty) || 1;
          let nx = (-ty / len) * thickness * 0.5;
          let ny = (tx / len) * thickness * 0.5;
          top.push({ x: px + nx, y: py + ny });
          bot.push({ x: px - nx, y: py - ny });
        }
        beginShape();
        for (let p of top) vertex(p.x, p.y);
        for (let i = bot.length - 1; i >= 0; i--) vertex(bot[i].x, bot[i].y);
        endShape(CLOSE);
      }

      function dancerHandPos(cx, cy, radius, d) {
        let a = d.baseAngle + sin(t * 0.35 + d.phase) * 0.22;
        let sway = sin(t * 0.9 + d.phase) * 0.18;
        let x = cx + cos(a) * radius;
        let y = cy + sin(a) * radius * 0.52 + height * 0.06;
        let s = d.scale * min(width, height) * 0.0024;
        let armR = sin(sway * 2.2 + 0.6) * 0.2;
        let armAngle = 0.65 + armR;
        let lx = 58 + cos(armAngle) * 48;
        let ly = -52 + sin(armAngle) * 48;
        return {
          x: x + (cos(sway) * lx - sin(sway) * ly) * s,
          y: y + (sin(sway) * lx + cos(sway) * ly) * s,
        };
      }

      function drawHandLinks(cx, cy, radius) {
        noStroke();
        fill(...SALMON);
        let count = dancers.length;
        let linkW = min(width, height) * 0.048;
        for (let i = 0; i < count; i++) {
          let d1 = dancers[i];
          let d2 = dancers[(i + 1) % count];
          let h1 = dancerHandPos(cx, cy, radius, d1);
          let h2 = dancerHandPos(cx, cy, radius, d2);
          drawSolidRibbon(
            h1.x,
            h1.y,
            h2.x,
            h2.y,
            -min(width, height) * 0.06,
            linkW,
          );
        }
      }

      function windowResized() {
        resizeCanvas(windowWidth, windowHeight);
      }
    </script>
  </body>
</html>
