<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Diamond Swarm</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #000; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <div id="app"></div>
  <div id="hint">Drag to orbit · Scroll to zoom · Double-click to reset</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/examples/jsm/postprocessing/EffectComposer.js": "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/EffectComposer.js",
      "three/examples/jsm/postprocessing/RenderPass.js":     "https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/RenderPass.js",
      "three/examples/jsm/postprocessing/UnrealBloomPass.js":"https://unpkg.com/three@0.160.0/examples/jsm/postprocessing/UnrealBloomPass.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls }  from 'three/addons/controls/OrbitControls.js';
    import { EffectComposer } from 'three/examples/jsm/postprocessing/EffectComposer.js';
    import { RenderPass }     from 'three/examples/jsm/postprocessing/RenderPass.js';
    import { UnrealBloomPass } from 'three/examples/jsm/postprocessing/UnrealBloomPass.js';

    const COUNT = 20000;
    const PARAMS = { size: 84, height: 0.875, spin: 0.68 };

    // ── Scene ────────────────────────────────────────────────────────
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x000000, 0.01);

    const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 0, 100);

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(innerWidth, innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    document.getElementById('app').appendChild(renderer.domElement);

    // ── Controls ─────────────────────────────────────────────────────
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping   = true;
    controls.dampingFactor   = 0.05;
    controls.autoRotate      = true;
    controls.autoRotateSpeed = 0.4;
    controls.minDistance     = 20;
    controls.maxDistance     = 800;

    // ── Bloom ────────────────────────────────────────────────────────
    const composer = new EffectComposer(renderer);
    composer.addPass(new RenderPass(scene, camera));
    const bloom = new UnrealBloomPass(new THREE.Vector2(innerWidth, innerHeight), 1.8, 0.4, 0);
    composer.addPass(bloom);

    // ── Instanced mesh ───────────────────────────────────────────────
    const geometry = new THREE.TetrahedronGeometry(0.25);
    const material = new THREE.MeshBasicMaterial({ color: 0xffffff });
    const mesh = new THREE.InstancedMesh(geometry, material, COUNT);
    mesh.instanceMatrix.setUsage(THREE.DynamicDrawUsage);
    scene.add(mesh);

    const positions = [];
    const initColor = new THREE.Color(0x00ff88);
    for (let i = 0; i < COUNT; i++) {
      positions.push(new THREE.Vector3(
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 100,
        (Math.random() - 0.5) * 100
      ));
      mesh.setColorAt(i, initColor);
    }

    // ── Animation ────────────────────────────────────────────────────
    const clock  = new THREE.Clock();
    const dummy  = new THREE.Object3D();
    const target = new THREE.Vector3();
    const pColor = new THREE.Color();

    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      const time = clock.getElapsedTime() * 1.7;

      const { size, height, spin } = PARAMS;
      const t   = time * spin;
      const cosT = Math.cos(t);
      const sinT = Math.sin(t);

      for (let i = 0; i < COUNT; i++) {
        const u    = i / COUNT;
        const angle = u * Math.PI * 2 * 400.0;
        const band  = (i % 200) / 200;

        let y = (band - 0.5) * 2;  // -1 → 1
        const absY = Math.abs(y);

        const radius = absY < 0.2
          ? 1.0
          : 1.0 - (absY - 0.2) * 1.25;
        const r = Math.max(radius, 0);

        const x = Math.cos(angle) * r;
        const z = Math.sin(angle) * r;

        // rotate Y
        const xr = x * cosT - z * sinT;
        const zr = x * sinT + z * cosT;

        target.set(xr * size, y * size * height, zr * size);
        pColor.setRGB(1, 1, 1);

        positions[i].lerp(target, 0.1);
        dummy.position.copy(positions[i]);
        dummy.updateMatrix();
        mesh.setMatrixAt(i, dummy.matrix);
        mesh.setColorAt(i, pColor);
      }

      mesh.instanceMatrix.needsUpdate = true;
      mesh.instanceColor.needsUpdate  = true;
      composer.render();
    }

    animate();

    // ── Reset on double-click ─────────────────────────────────────────
    renderer.domElement.addEventListener('dblclick', () => {
      camera.position.set(0, 0, 100);
      controls.reset();
    });

    // ── Resize ───────────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
      composer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
