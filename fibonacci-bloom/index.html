<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Fibonacci Bloom</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { overflow: hidden; background: #06060f; }
    canvas { display: block; }
    #hint {
      position: fixed;
      bottom: 22px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.35);
      font-family: system-ui, sans-serif;
      font-size: 13px;
      letter-spacing: 0.06em;
      pointer-events: none;
      white-space: nowrap;
    }
  </style>
</head>
<body>
  <canvas id="c"></canvas>
  <div id="hint">Drag to orbit · Scroll to zoom · Double-click to reset</div>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
      "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
    }
  }
  </script>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

    // ── Renderer ─────────────────────────────────────────────────
    const canvas   = document.getElementById('c');
    const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));

    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x06060f);

    const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.1, 2000);
    camera.position.set(0, 90, 140);

    const controls = new OrbitControls(camera, canvas);
    controls.enableDamping  = true;
    controls.dampingFactor  = 0.05;
    controls.autoRotate     = true;
    controls.autoRotateSpeed = 0.4;
    controls.minDistance    = 20;
    controls.maxDistance    = 500;

    // ── Plasma colour map (approximation) ────────────────────────
    function plasma(t) {
      const r = Math.min(1, Math.max(0, 0.5 + 1.4 * (t - 0.5) + 0.6 * Math.sin(Math.PI * t + 0.5)));
      const g = Math.min(1, Math.max(0, 0.05 + 1.2 * Math.sin(Math.PI * t * 0.9)));
      const b = Math.min(1, Math.max(0, 1.0 - 1.6 * t + 0.4 * Math.sin(Math.PI * t + 2)));
      return { r, g, b };
    }

    // ── Fibonacci Bloom geometry ──────────────────────────────────
    const PHI       = (1 + Math.sqrt(5)) / 2;
    const N         = 4000;
    const SCALE     = 2.8;
    const WAVE_AMP  = 0.18;
    const WAVE_FREQ = 8;
    const N_LAYERS  = 3;

    // Sprite texture — soft glowing circle
    const sCanvas = document.createElement('canvas');
    sCanvas.width = sCanvas.height = 64;
    const sCtx = sCanvas.getContext('2d');
    const grad = sCtx.createRadialGradient(32, 32, 0, 32, 32, 32);
    grad.addColorStop(0,   'rgba(255,255,255,1)');
    grad.addColorStop(0.35,'rgba(255,255,255,0.8)');
    grad.addColorStop(1,   'rgba(255,255,255,0)');
    sCtx.fillStyle = grad;
    sCtx.fillRect(0, 0, 64, 64);
    const sprite = new THREE.CanvasTexture(sCanvas);

    const layerScales = [1.0, 0.62, 0.38];
    const layerPhases = [0, Math.PI / PHI, Math.PI];

    for (let layer = 0; layer < N_LAYERS; layer++) {
      const n     = N - layer * 500;
      const sc    = layerScales[layer];
      const phase = layerPhases[layer];
      const wf    = WAVE_FREQ + layer * 2;
      const wa    = WAVE_AMP  * (1 - layer * 0.06);

      const pos  = new Float32Array(n * 3);
      const col  = new Float32Array(n * 3);

      for (let i = 1; i <= n; i++) {
        const theta = i * 2 * Math.PI / PHI + phase;
        const r     = Math.sqrt(i) * SCALE * sc;
        const wave  = 1 + wa * Math.sin(wf * theta);
        const rw    = r * wave;

        const x = rw * Math.cos(theta);
        const y = rw * Math.sin(theta);
        // Dish curvature: outer rim lifts gently
        const z = -(rw * 0.012) * rw + 0.5 * rw * Math.sin(theta * 2 + layer);

        const j = (i - 1) * 3;
        pos[j]     = x;
        pos[j + 1] = z;
        pos[j + 2] = y;

        const t  = ((theta / (2 * Math.PI)) % 1.0 + layer / N_LAYERS) % 1.0;
        const c  = plasma(t);
        col[j]     = c.r;
        col[j + 1] = c.g;
        col[j + 2] = c.b;
      }

      const geo = new THREE.BufferGeometry();
      geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
      geo.setAttribute('color',    new THREE.BufferAttribute(col, 3));

      // Core dots
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        size:         1.4 - layer * 0.2,
        vertexColors: true,
        transparent:  true,
        opacity:      0.90,
        map:          sprite,
        alphaTest:    0.01,
        depthWrite:   false,
        blending:     THREE.AdditiveBlending,
      })));

      // Glow halo
      scene.add(new THREE.Points(geo, new THREE.PointsMaterial({
        size:         5.0 - layer * 0.5,
        vertexColors: true,
        transparent:  true,
        opacity:      0.07,
        map:          sprite,
        alphaTest:    0.001,
        depthWrite:   false,
        blending:     THREE.AdditiveBlending,
      })));
    }

    // ── Animation ────────────────────────────────────────────────
    function animate() {
      requestAnimationFrame(animate);
      controls.update();
      renderer.render(scene, camera);
    }
    animate();

    // ── Reset on double-click ─────────────────────────────────────
    canvas.addEventListener('dblclick', () => {
      camera.position.set(0, 90, 140);
      controls.reset();
    });

    // ── Resize ───────────────────────────────────────────────────
    window.addEventListener('resize', () => {
      camera.aspect = innerWidth / innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(innerWidth, innerHeight);
    });
  </script>
</body>
</html>
